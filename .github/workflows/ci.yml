name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the local dev venv (backend/venv is 3.14).
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      # --cov makes coverage VISIBLE, not gated: no floor, no failure threshold. Before this,
      # pytest-cov was installed and never invoked, so every coverage statement about this repo
      # was inference (REVIEW-2026-08 T4). The xml lands as an artifact on every run.
      - name: Run unit & API tests (with coverage)
        run: |
          cd backend
          python -m pytest tests/ -q --ignore=tests/test_e2e.py \
            --cov=. --cov-report=xml --cov-report=term:skip-covered

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

      # test_e2e.py runs sync-TestClient WebSocket flows that are timing-sensitive
      # under full-suite load (intermittent one-test flakes when interleaved).
      # Run it serially as its own step, mirroring the documented local practice.
      # pytest.ini's pytest-timeout net converts any hang into a failed test with
      # a stack dump instead of a stuck runner.
      - name: Run e2e WebSocket tests (serial)
        run: |
          cd backend
          python -m pytest tests/test_e2e.py -q

  backend-postgres-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parity
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install psycopg[binary]

      # Applies the rendered sql/games-schema.sql to a real Postgres and
      # exercises the RPCs (wallets, streak bonus, referrals) so the Supabase
      # SQL can't silently drift from the SQLite semantics. The test module
      # skips itself when PARITY_POSTGRES_DSN is unset (local runs without pg).
      - name: Apply rendered schema + run RPC parity tests
        env:
          PARITY_POSTGRES_DSN: postgresql://parity:parity@localhost:5432/parity
        run: |
          cd backend
          python -m pytest tests/test_postgres_parity.py -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # `npx tsc --noEmit` is a NO-OP in this repo and must not be used: the root
      # tsconfig.json is `{"files": [], "references": [...]}`, so bare tsc resolves
      # zero input files, prints nothing, and exits 0 no matter how broken the code
      # is. It silently passed for a whole session while two real type errors sat in
      # the tree. `tsc -b` (what `npm run build` uses) is what actually walks the
      # project references. Kept as an explicit step so a type error is attributed to
      # typechecking rather than surfacing later as a confusing build failure.
      - name: Type check
        run: |
          cd frontend
          npx tsc -b --force

      - name: Unit tests
        run: |
          cd frontend
          npx vitest run

      - name: Build
        run: |
          cd frontend
          npm run build

  # The canonical "every game is playable" suite (frontend/e2e/all-games.spec.ts) previously ran
  # in NO CI — only when someone remembered on a laptop. The catalog could regress a game and CI
  # stayed green (REVIEW-2026-08 T1). It enumerates GET /catalog at runtime, so a newly added
  # game is covered with zero test-writing; test_e2e_game_coverage.py guards drivability.
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # scripts/e2e-local-stack.sh looks for backend/venv, same as local dev.
      - name: Install backend into a venv
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install -q -r backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: All-games behavioral suite (REQUIRED)
        run: ./scripts/e2e-local-stack.sh npx playwright test e2e/all-games.spec.ts --project chromium-desktop --workers=2 --reporter=line

      # ADVISORY until linux baselines are committed: every committed screenshot baseline is
      # *-darwin.png, and Playwright names snapshots per-platform, so this run writes the missing
      # *-linux.png files and fails. The artifact below carries those linux baselines — download,
      # review, commit them into frontend/e2e/*-snapshots/, then delete this comment and the
      # continue-on-error line to make the visual suite gate too.
      - name: Visual regression (advisory — see comment)
        continue-on-error: true
        run: ./scripts/visual-regression.sh --project chromium-desktop

      - name: Upload visual snapshots + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-linux-baselines
          path: |
            frontend/e2e/*-snapshots/
            frontend/test-results-visual/
          retention-days: 14

  # supabase_db.py is what PRODUCTION runs, and it sat at 30% coverage with 33 functions never
  # executed (ANALYSIS-2026-08-09-coverage.md). These suites drive the REAL module against REAL
  # PostgREST + Postgres and immediately found two prod-reachable bugs: credit_purchase raising on
  # a concurrent duplicate payment (Stripe retry storm) and migrate_grace_proofs duplicating a
  # grace window. They must run on every push or that coverage decays again.
  #
  # Deliberately reuses scripts/parity-stack.sh — the same path developers run locally, so CI and
  # local cannot drift. Docker is available on ubuntu runners, so no service containers are needed
  # (and PostgREST must start AFTER the schema exists, which a service container cannot express:
  # it caches the schema at boot).
  backend-supabase-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install psycopg[binary]

      - name: Bring up Postgres + PostgREST
        run: ./scripts/parity-stack.sh up

      - name: Run the Supabase-path suites (money rails, races, economy, content)
        run: |
          eval "$(./scripts/parity-stack.sh env)"
          cd backend
          python -m pytest \
            tests/test_supabase_money_rails.py \
            tests/test_supabase_concurrency.py \
            tests/test_supabase_economy_features.py \
            tests/test_supabase_content_layer.py \
            -q -p no:randomly

      # The races are probabilistic: the credit_purchase bug reproduced ~3 times in 8 runs. One
      # pass proves little, so the concurrency suite runs repeatedly.
      - name: Re-run the concurrency suite (races need repetition)
        run: |
          eval "$(./scripts/parity-stack.sh env)"
          cd backend
          for i in 1 2 3 4 5; do
            echo "--- concurrency run $i ---"
            python -m pytest tests/test_supabase_concurrency.py -q -p no:randomly || exit 1
          done

      - name: Coverage of the production DB layer
        run: |
          eval "$(./scripts/parity-stack.sh env)"
          cd backend
          python -m pytest tests/ -q --ignore=tests/test_e2e.py \
            --cov=supabase_db --cov-report=term --cov-report=xml:supabase-coverage.xml

      - name: Upload supabase_db coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-coverage
          path: backend/supabase-coverage.xml
          retention-days: 30

      - name: Tear down
        if: always()
        run: ./scripts/parity-stack.sh down
