<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0A0612" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Revelry Games" />
    <meta name="description" content="AI-powered party games for groups and events" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Revelry Games" />
    <meta property="og:description" content="Join the party game. No app download needed." />
    <meta property="og:image" content="https://games.revelryapp.me/og-image.png" />
    <meta property="og:url" content="https://games.revelryapp.me/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Links (Vite rewrites these paths when base is set) -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192" />

    <title>Revelry Games</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker from the app root. Embedded host-app surfaces
      // skip registration so nested iframe routes never resolve sw.js through
      // the SPA fallback as text/html.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const params = new URLSearchParams(window.location.search);
          const isHostAppSurface = window.parent !== window
            || window.location.pathname.startsWith('/revelry/')
            || params.get('embed') === '1'
            || params.has('launch_token')
            || params.has('party_games_token')
            || params.has('authoring_token');
          if (isHostAppSurface) return;

          const manifestHref = document.querySelector('link[rel="manifest"]')?.href || new URL('manifest.json', window.location.origin).href;
          navigator.serviceWorker.register(new URL('sw.js', manifestHref).href)
            .then((reg) => {
              console.log('SW registered:', reg.scope);

              const notifyUpdate = (worker) => {
                if (!worker || !navigator.serviceWorker.controller) return;
                window.dispatchEvent(new CustomEvent('localplay-sw-update', {
                  detail: { worker },
                }));
              };

              notifyUpdate(reg.waiting);

              reg.addEventListener('updatefound', () => {
                const worker = reg.installing;
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                  if (worker.state === 'installed') notifyUpdate(worker);
                });
              });

              window.setInterval(() => reg.update(), 60 * 60 * 1000);
            })
            .catch((err) => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
